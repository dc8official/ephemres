# Installed by Ephemres as /etc/sysctl.d/90-ephemres.conf.
#
# The engine's ICMP socket and flowd's NetFlow/IPFIX sockets ask for a 4 MB receive
# buffer. Linux caps that request at net.core.rmem_max, which is 212992 bytes on a stock
# install. With the small buffer the kernel silently drops replies and flow packets when
# thousands arrive at once: 3.9% of pings were lost at 5,000 endpoints, and 1.5% of
# flows at 10,000 flows a second. This only raises the cap; it uses no memory until a
# socket asks for it. The installer leaves a higher value already set on the host alone.
net.core.rmem_max = 8388608
