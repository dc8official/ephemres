/var/log/ephemres/*.log {
    su ephemres ephemres
    daily
    copytruncate
    rotate 30
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    create 0640 ephemres ephemres
    sharedscripts
    postrotate
        systemctl reload ephemres-engine ephemres-api > /dev/null 2>&1 || true
    endscript
}
